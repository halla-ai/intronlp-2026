<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>비교 조건 확인</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls,.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.token.visible{background:var(--soft);border-color:var(--accent)}.token.target{font-weight:700;border:2px solid var(--accent)}.token.hidden{opacity:.45}.note{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.small{font-size:12px;opacity:.8}.result{padding:12px;background:var(--card);border-radius:10px}</style></head><body class="dark"><h1>같은 조건과 바뀌는 조건</h1><p>설명용 설정 비교. 실제 모델 출력·성능 수치 없음.</p><label for="comparison">비교 선택</label><div class="controls"><select id="comparison"><option value="examples">일반 zero-shot ↔ few-shot</option><option value="models">일반 zero-shot ↔ 추론형</option></select></div><div class="note"><strong>같은 조건</strong><p id="same"></p></div><div class="note"><strong>바뀌는 조건</strong><p id="different"></p></div><p id="conclusion" aria-live="polite"></p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}theme(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const cases={examples:['일반 모델 파일, 공개 원문, 길이·요금 질문, UNKNOWN 규칙, CPU, 생성 설정과 상한','앞의 답변 예시 두 개: 없음 ↔ 있음','이 입력에서 예시 유무에 따른 실제 출력 차이를 살펴볼 비교. 새 모델 학습 아님.'],models:['공개 원문, 길이·요금 질문, UNKNOWN 규칙, 예시 없음, CPU','모델 파일·크기·학습 결과·생성 설정·상한: 일반 64토큰, 추론형 256토큰','같은 질문에 대한 답과 풀이를 관찰할 비교. 여러 조건이 달라 추론형 방식 하나의 효과로 단정 불가.']};function render(){const c=cases[document.getElementById('comparison').value];['same','different','conclusion'].forEach((id,i)=>document.getElementById(id).textContent=c[i])}document.getElementById('comparison').onchange=render;render();</script></body></html>
