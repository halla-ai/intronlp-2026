<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>답과 보이는 풀이의 구분</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls,.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.token.visible{background:var(--soft);border-color:var(--accent)}.token.target{font-weight:700;border:2px solid var(--accent)}.token.hidden{opacity:.45}.note{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.small{font-size:12px;opacity:.8}.result{padding:12px;background:var(--card);border-radius:10px}</style></head><body class="dark"><h1>풀이와 최종 답은 서로 다른 칸</h1><p>사람이 정한 설명용 모식도. 아래 텍스트는 실제 모델 결과 아님.</p><label for="mode">출력 형태 선택</label><div class="controls"><select id="mode"><option value="direct">바로 답하는 형태</option><option value="reason">풀이 뒤 답하는 형태</option><option value="limit">풀이 도중 길이 제한</option></select></div><div id="process" class="note"></div><div id="answer" class="note"></div><p id="status" aria-live="polite"></p><p class="small">보이는 풀이는 생성 텍스트. 실제 내부 상태를 충실히 기록했다는 증거와 구분. 긴 풀이와 정확한 답도 구분.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}theme(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const views={direct:['보이는 풀이: 별도 구분 없음','답 예시: KM=11; FEE=UNKNOWN','답의 숫자와 UNKNOWN을 원문 근거로 검토 필요.'],reason:['보이는 풀이 예시: 원문에 11-kilometer 확인. 요금 기재 없음.','최종 답 예시: KM=11; FEE=UNKNOWN','풀이 뒤 답도 원문 근거로 별도 검토 필요.'],limit:['도중 풀이 예시: 원문에 11-kilometer 확인. 요금을 확인하려면...','최종 답: 없음 (answer=None)','truncated: 풀이 경계 전에 길이 제한 도달. 도중 풀이를 최종 답으로 사용하지 않음.']};function render(){const v=views[document.getElementById('mode').value];['process','answer','status'].forEach((id,i)=>document.getElementById(id).textContent=v[i])}document.getElementById('mode').onchange=render;render();</script></body></html>
