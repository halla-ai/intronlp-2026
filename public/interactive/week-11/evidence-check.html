<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>주장과 원문 근거 대조</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls,.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.token.visible{background:var(--soft);border-color:var(--accent)}.token.target{font-weight:700;border:2px solid var(--accent)}.token.hidden{opacity:.45}.note{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.small{font-size:12px;opacity:.8}.result{padding:12px;background:var(--card);border-radius:10px}</style></head><body class="dark"><h1>주장마다 근거를 확인</h1><div class="note"><strong>공개 발췌</strong><p>Jeju Olle Trail Route 6 is an 11-kilometer coastal and urban trail.</p></div><p>사람이 만든 주장 후보의 분류 연습. 실제 모델 출력 아님.</p><label for="claim">주장 선택</label><div class="controls"><select id="claim"><option value="length">6코스 길이는 11km</option><option value="fee">6코스 입장 요금은 무료</option><option value="coast">해안과 도심의 길 포함</option><option value="today">오늘도 운영 조건 동일</option></select></div><div id="result" class="result" aria-live="polite"></div><p class="small">미확인은 거짓과 구분. 이 발췌에서 확인되지 않은 정보는 별도 공식 자료 대조 전 안내 보류. 발췌의 수치도 최신 운영 조건 보증 아님.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}theme(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const items={length:'발췌 근거 있음: 11-kilometer. 실습에서는 KM=11로 대조.',fee:'발췌에 요금 정보 없음. FEE=UNKNOWN. 무료라는 주장은 별도 공식 요금 자료 대조 필요.',coast:'발췌 근거 있음: coastal and urban trail. 해안·도심의 성격 설명.',today:'발췌만으로 오늘의 운영 확인 불가. 최신 공식 안내 대조 필요.'};function render(){document.getElementById('result').textContent=items[document.getElementById('claim').value]}document.getElementById('claim').onchange=render;render();</script></body></html>
