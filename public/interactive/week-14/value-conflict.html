<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Q3: 누구의 부담을 어디서 줄일까</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{max-width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note,.result{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.result{background:var(--card);white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:12px;opacity:.8}label{display:block;margin-bottom:5px}</style></head><body class="dark"><h1>Q3: 누구의 부담을 어디서 줄일까</h1><p>도내 안내 조직을 상정한 정책 선택 연습. 실제 기업 운영·비용·정답 정책 없음.</p><label for="case">상정 상황</label><select id="case"><option value="meaning">제주어 낱말의 뜻을 묻는 질문</option><option value="privacy">개인 연락처가 포함된 문의</option><option value="risk">현장 안전을 판단해 달라는 질문</option></select><div class="controls"><button type="button" data-policy="fast" aria-pressed="false">즉시 자동 안내</button><button type="button" data-policy="review" aria-pressed="true">근거와 사람 검토</button><button type="button" data-policy="hold" aria-pressed="false">답변 보류·담당자 연결</button></div><p id="result" class="result" aria-live="polite"></p><p class="note">각 선택의 이득·부담·누락된 근거 기록. 답변을 전부 막는 것과 무조건 허용하는 것 사이에서 범위·검토·보류 조건 설계.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
let policy='review';const choices={meaning:{fast:'이득: 빠른 답. 부담: 잘못된 대응이 그대로 안내될 가능성. 필요한 근거: 원문·실제 출력·모르는 말의 보류 처리.',review:'이득: 대응어와 원문을 확인하고 지역 표현을 보존. 부담: 검토 시간. 필요한 조건: 확인자가 읽을 출처와 검토 범위.',hold:'이득: 확인하지 못한 답의 유통 예방. 부담: 쉬운 질문도 지연될 수 있음. 필요한 조건: 보류 이유와 지역 언어 담당자 연결.'},privacy:{fast:'이득: 빠른 응답. 부담: 불필요한 개인정보가 입력·기록에 남을 수 있음. 먼저 삭제·최소화·접근 범위 확인 필요.',review:'이득: 불필요한 개인정보를 제거한 뒤 필요한 내용만 검토. 부담: 확인자의 책임과 접근 관리 필요. 모든 원문을 공유하는 검토는 적절하지 않을 수 있음.',hold:'이득: 민감한 원문 확산 예방. 부담: 문의 해결 지연. 개인정보 없는 질문으로 다시 받거나 정해진 담당 절차 연결.'},risk:{fast:'이득: 즉시 답. 부담: 틀린 안내의 신체적 피해 가능성. 작은 대응쌍 실험은 안전 안내 적합성을 입증하지 못함.',review:'이득: 해당 상황의 공식 근거와 담당자의 판단 연결. 부담: 최신 자료·확인 인력 필요. 근거 없으면 보류.',hold:'이득: 검증하지 않은 안전 판단을 자동으로 전달하지 않음. 부담: 사용자가 다른 경로를 찾아야 함. 상황에 맞는 공식 담당 안내 필요.'}};function render(){document.getElementById('result').textContent=choices[document.getElementById('case').value][policy];document.querySelectorAll('[data-policy]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.policy===policy)))}document.getElementById('case').onchange=render;document.querySelectorAll('[data-policy]').forEach(b=>b.onclick=()=>{policy=b.dataset.policy;render()});render();</script></body></html>
