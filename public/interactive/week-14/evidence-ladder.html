<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>설명, 근거, 계산 원인을 구분하기</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{max-width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note,.result{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.result{background:var(--card);white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:12px;opacity:.8}label{display:block;margin-bottom:5px}</style></head><body class="dark"><h1>설명, 근거, 계산 원인을 구분하기</h1><p>확인할 주장과 증거의 범위를 연결하는 교육용 판단표. 실제 모델 출력·내부 상태 측정 없음.</p><label for="claim">확인하려는 주장</label><select id="claim"><option value="meaning">바당의 대응어가 바다인가</option><option value="bias">이 모델은 제주어 전체를 공정하게 다루는가</option><option value="cause">모델이 표시한 이유가 실제 계산 원인인가</option></select><div class="controls"><button type="button" data-evidence="explanation" aria-pressed="false">그럴듯한 설명문</button><button type="button" data-evidence="source" aria-pressed="true">공개 원문 대응</button><button type="button" data-evidence="pairs" aria-pressed="false">세 쌍 실제 실행 기록</button></div><p id="result" class="result" aria-live="polite"></p><p class="note">보이는 설명은 읽고 검토할 생성 결과. 그 설명만으로 모델 내부 계산을 재현한 기록이라고 단정할 근거 없음.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
let evidence='source';const claims={meaning:{source:'해당 자료의 용례에서는 대응 확인 가능. 문맥·지역 전체의 의미까지 확정한 것은 아님.',explanation:'표현이 자연스럽다는 것만으로 대응 확인 불가. 원문의 해당 부분을 먼저 대조.',pairs:'실제 출력이 무엇인지는 확인 가능. 정답 기준은 별도로 공개 원문에서 확인.'},bias:{source:'세 낱말의 원문 대응만 확인. 모델 전체 공정성의 증거는 아님.',explanation:'자신이 공정하다고 설명하는 문장만으로 공정성 확인 불가.',pairs:'이 조건의 작은 관찰. 다양한 문맥·지역·사용자·피해를 추가 점검하기 전 전체 공정성 판단 보류.'},cause:{source:'답의 내용 대조에는 사용 가능. 내부 계산 원인의 증거는 아님.',explanation:'생성된 이유를 읽는 것과 실제 계산 원인을 아는 것의 차이. 설명 문자열만으로 내부 원인 확인 불가.',pairs:'입력·출력 차이는 관찰 가능. 그 차이만으로 내부 계산 경로나 훈련 자료의 원인을 특정하기 어려움.'}};function render(){document.getElementById('result').textContent=claims[document.getElementById('claim').value][evidence];document.querySelectorAll('[data-evidence]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.evidence===evidence)))}document.getElementById('claim').onchange=render;document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{evidence=b.dataset.evidence;render()});render();</script></body></html>
