<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>같은 질문, 대응 낱말만 바꾸기</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{max-width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note,.result{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.result{background:var(--card);white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:12px;opacity:.8}label{display:block;margin-bottom:5px}</style></head><body class="dark"><h1>같은 질문, 대응 낱말만 바꾸기</h1><p>공개 대응 자료를 읽는 교육용 그림. 모델 실행·모델 답변 없음.</p><label for="pair">원문 대응쌍</label><select id="pair"><option value="sea">바당 / 바다</option><option value="sand">모살 / 모래</option><option value="tree">굴무기 / 느티나무</option></select><div class="controls"><button type="button" id="standard" aria-pressed="false">표준어 질문</button><button type="button" id="jeju" aria-pressed="true">제주어 질문</button><button type="button" id="source" aria-pressed="false">참고 자료 추가</button></div><div id="prompt" class="result" aria-live="polite"></div><p id="expected" class="note"></p><p class="small">제주학연구센터 '제주어 길라잡이' 인쇄면 109쪽. 세 대응만 추출, 질문은 수업용 가공. 실제 모델 답은 노트북 실행 후 기록.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const pairs={sea:['바다','바당'],sand:['모래','모살'],tree:['느티나무','굴무기']};let mode='jeju',source=false;const selector=document.getElementById('pair');function render(){const pair=pairs[selector.value];document.getElementById('prompt').textContent=(source?'참고 자료: 바당 = 바다; 모살 = 모래; 굴무기 = 느티나무.\n':'')+"질문: '"+pair[mode==='jeju'?1:0]+"'의 표준어 대응어는 무엇인가요? 표준어 대응어 한 개만 적어 주세요. 모르면 확인 불가라고 적어 주세요.";document.getElementById('expected').textContent='원문 대조 기준: '+pair[0]+'. 이것은 출처에서 확인한 대응이며 모델 출력이 아님.';['standard','jeju'].forEach(k=>document.getElementById(k).setAttribute('aria-pressed',String(k===mode)));document.getElementById('source').setAttribute('aria-pressed',String(source));document.getElementById('source').disabled=mode==='standard';}selector.onchange=render;['standard','jeju'].forEach(k=>document.getElementById(k).onclick=()=>{mode=k;if(mode==='standard')source=false;render()});document.getElementById('source').onclick=()=>{if(mode==='jeju')source=!source;render()};render();</script></body></html>
