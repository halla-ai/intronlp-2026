<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차례로 읽기와 서로 참고하기</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font:15px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.dark{--bg:#101418;--fg:#edf2f6;--card:#1c242b;--line:#728391;--accent:#8fd9df}body.light{--bg:#fff;--fg:#182833;--card:#edf3f5;--line:#647a89;--accent:#075c69}h2{margin:0 0 8px;font-size:20px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:7px 12px;border-radius:6px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.cards{display:flex;flex-wrap:wrap;gap:8px}.card{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:6px}.active{outline:3px solid var(--accent);outline-offset:-3px}small{font-size:13px}table{border-collapse:collapse;width:100%;min-width:390px}td,th{padding:8px;text-align:center;border:1px solid var(--line)}.scroll{overflow:auto}.bar{display:block;height:9px;background:var(--accent);margin:4px 0}.note{padding:12px;border:1px solid var(--line);border-radius:6px}</style></head><body class="dark"><h2>차례로 읽기와 서로 참고하기</h2><p>설명용 문장: 민지는 제주에서 우산을 샀다. 그것은 빨갛다.</p><div class="controls"><button id="rnn" type="button" aria-pressed="true">RNN: 차례로 읽기</button><button id="att" type="button" aria-pressed="false">어텐션: 참고 위치 보기</button><button id="next" type="button">다음 토큰</button></div><div id="tokens" class="cards"></div><p id="status" role="status" aria-live="polite"></p><p class="note">구조 설명용 도식. RNN의 기억이 특정 거리에서 사라진다는 측정 결과가 아님. 어텐션 모드에서 우산을 표시한 것은 사람이 지정한 참조 관계이며 실제 모델 결과가 아님.</p><script>let fromParent=false;const media=matchMedia('(prefers-color-scheme: light)');function theme(light){document.body.className=light?'light':'dark'}theme(media.matches);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme==='light')}});media.addEventListener('change',e=>{if(!fromParent)theme(e.matches)});parent.postMessage({type:'figure-ready'},'*');
const words=['민지는','제주에서','우산을','샀다','그것은','빨갛다'];let position=0,mode='rnn';const tokens=document.getElementById('tokens');words.forEach(word=>{const item=document.createElement('span');item.className='card';item.textContent=word;tokens.append(item)});function render(){Array.from(tokens.children).forEach((item,i)=>item.classList.toggle('active',mode==='rnn'?i===position:i===2||i===4));document.getElementById('rnn').setAttribute('aria-pressed',mode==='rnn');document.getElementById('att').setAttribute('aria-pressed',mode==='att');document.getElementById('next').disabled=mode!=='rnn';document.getElementById('status').textContent=mode==='rnn'?`${position+1}번째 토큰 읽기. 이전 상태와 현재 입력으로 새 상태 생성. 앞선 정보는 상태를 거쳐 전달.`:'그것은 → 우산을. 현재 위치에서 필요한 앞 위치를 참고하는 연결. 실제 가중치는 노트북에서 확인.'}document.getElementById('rnn').onclick=()=>{mode='rnn';render()};document.getElementById('att').onclick=()=>{mode='att';render()};document.getElementById('next').onclick=()=>{position=(position+1)%words.length;render()};render();</script></body></html>
