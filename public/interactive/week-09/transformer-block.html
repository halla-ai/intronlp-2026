<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>트랜스포머 한 블록의 흐름</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font:15px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.dark{--bg:#101418;--fg:#edf2f6;--card:#1c242b;--line:#728391;--accent:#8fd9df}body.light{--bg:#fff;--fg:#182833;--card:#edf3f5;--line:#647a89;--accent:#075c69}h2{margin:0 0 8px;font-size:20px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:7px 12px;border-radius:6px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.cards{display:flex;flex-wrap:wrap;gap:8px}.card{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:6px}.active{outline:3px solid var(--accent);outline-offset:-3px}small{font-size:13px}table{border-collapse:collapse;width:100%;min-width:390px}td,th{padding:8px;text-align:center;border:1px solid var(--line)}.scroll{overflow:auto}.bar{display:block;height:9px;background:var(--accent);margin:4px 0}.note{padding:12px;border:1px solid var(--line);border-radius:6px}</style></head><body class="dark"><h2>트랜스포머 한 블록의 흐름</h2><p>인코더 블록의 개념 도식. 단어마다 벡터가 있고, 블록을 반복하며 문맥 반영.</p><div class="controls"><label for="stage">단계 선택 </label><select id="stage"><option value="0">1. 토큰과 위치 정보</option><option value="1">2. 여러 헤드의 자기 어텐션</option><option value="2">3. 연결·정규화</option><option value="3">4. 위치별 피드포워드</option><option value="4">5. 연결·정규화 후 다음 블록</option></select></div><div id="steps" class="cards"></div><p id="status" role="status" aria-live="polite"></p><p class="note">앞뒤를 참고하는 인코더를 설명하는 도식. 다음 토큰을 생성하는 디코더의 자기 어텐션은 뒤쪽 토큰을 가리는 마스크 사용. 모든 트랜스포머가 같은 방향으로 읽는 것은 아님.</p><script>let fromParent=false;const media=matchMedia('(prefers-color-scheme: light)');function theme(light){document.body.className=light?'light':'dark'}theme(media.matches);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme==='light')}});media.addEventListener('change',e=>{if(!fromParent)theme(e.matches)});parent.postMessage({type:'figure-ready'},'*');
const labels=['입력 + 위치','자기 어텐션','연결·정규화','피드포워드','연결·정규화'];const notes=['토큰 벡터에 위치 정보 추가. 병렬로 보더라도 어순 구별 가능.','각 위치가 다른 위치의 벡터를 서로 다른 참고 비중으로 모음. 여러 헤드는 별도의 비중을 계산.','입력을 더해 정보 전달 경로를 유지하고 크기 조절. 여기서는 수식 대신 역할 관찰.','각 위치에서 같은 신경망으로 벡터 변환. 위치끼리 참고하는 단계는 앞의 어텐션.','다시 입력을 연결하고 정규화한 결과를 다음 블록으로 전달.'];labels.forEach(label=>{const item=document.createElement('span');item.className='card';item.textContent=label;document.getElementById('steps').append(item)});function render(){const index=Number(document.getElementById('stage').value);Array.from(document.getElementById('steps').children).forEach((item,i)=>item.classList.toggle('active',i===index));document.getElementById('status').textContent=notes[index]}document.getElementById('stage').onchange=render;render();</script></body></html>
