<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>같은 문장, 다른 참고 비중</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font:15px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.dark{--bg:#101418;--fg:#edf2f6;--card:#1c242b;--line:#728391;--accent:#8fd9df}body.light{--bg:#fff;--fg:#182833;--card:#edf3f5;--line:#647a89;--accent:#075c69}h2{margin:0 0 8px;font-size:20px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:7px 12px;border-radius:6px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.cards{display:flex;flex-wrap:wrap;gap:8px}.card{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:6px}.active{outline:3px solid var(--accent);outline-offset:-3px}small{font-size:13px}table{border-collapse:collapse;width:100%;min-width:390px}td,th{padding:8px;text-align:center;border:1px solid var(--line)}.scroll{overflow:auto}.bar{display:block;height:9px;background:var(--accent);margin:4px 0}.note{padding:12px;border:1px solid var(--line);border-radius:6px}</style></head><body class="dark"><h2>같은 문장, 다른 참고 비중</h2><p>사람이 지정한 교육용 가중치. 현재 토큰 '그것은'의 참고 비중 관찰.</p><div class="controls"><label for="head">교육용 헤드 </label><select id="head"><option value="0">A: 우산을에 큰 비중</option><option value="1">B: 가까운 위치에 큰 비중</option><option value="2">C: 고른 비중</option></select></div><div class="scroll"><table><caption>행 하나의 가중치 합 1.00, 정답 확률 아님</caption><thead><tr id="names"></tr></thead><tbody><tr id="weights"></tr></tbody></table></div><p id="status" role="status" aria-live="polite"></p><p class="note">이 숫자는 학습 모델에서 얻은 값이 아님. 실제 모델에서는 헤드·층에 따라 참고 비중이 달라짐. 가장 큰 가중치만으로 '모델이 정답을 이해했다'는 결론 불가.</p><script>let fromParent=false;const media=matchMedia('(prefers-color-scheme: light)');function theme(light){document.body.className=light?'light':'dark'}theme(media.matches);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme==='light')}});media.addEventListener('change',e=>{if(!fromParent)theme(e.matches)});parent.postMessage({type:'figure-ready'},'*');
const words=['민지는','제주에서','우산을','샀다','그것은','빨갛다'];const rows=[[.05,.05,.70,.05,.10,.05],[.05,.05,.10,.35,.35,.10],Array(6).fill(1/6)];words.forEach(w=>{const th=document.createElement('th');th.scope='col';th.textContent=w;document.getElementById('names').append(th)});function render(){const row=rows[Number(document.getElementById('head').value)];const target=document.getElementById('weights');target.replaceChildren();row.forEach(value=>{const td=document.createElement('td');td.textContent=value.toFixed(3);const bar=document.createElement('span');bar.className='bar';bar.style.width=(value*100)+'%';bar.setAttribute('aria-hidden','true');td.append(bar);target.append(td)});document.getElementById('status').textContent='반올림 전 가중치 합: '+row.reduce((a,b)=>a+b,0).toFixed(2)+'. 큰 비중의 위치가 헤드 설정에 따라 달라짐.'}document.getElementById('head').onchange=render;render();</script></body></html>
