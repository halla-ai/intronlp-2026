<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미리 학습된 벡터의 이웃</title>
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px;overflow:hidden;font-size:13.5px;line-height:1.5}
body.light{--bg:#ffffff;--card:#f6f8fa;--text:#1f2328;--muted:#57606a;--border:#d0d7de;--a:#2563eb;--a-soft:rgba(37,99,235,.10);--w:#b45309;--w-soft:rgba(180,83,9,.10);--pos:#16a34a;--pos-soft:rgba(22,163,74,.12);--neg:#dc2626;--neg-soft:rgba(220,38,38,.10)}
body.dark{--bg:#080808;--card:#141414;--text:#ededed;--muted:#9ca3af;--border:#2c2c2c;--a:#22d3ee;--a-soft:rgba(34,211,238,.12);--w:#fbbf24;--w-soft:rgba(251,191,36,.12);--pos:#4ade80;--pos-soft:rgba(74,222,128,.14);--neg:#f87171;--neg-soft:rgba(248,113,113,.13)}
.cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.note{margin:8px 0 0;padding:8px 10px;border:1px dashed var(--border);border-radius:10px;font-size:12.5px;color:var(--muted)}
.note b{color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-bottom:10px}
.seg button{font:inherit;font-size:12.5px;padding:4px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--a-soft);color:var(--a);font-weight:600}
.chip{font:inherit;font-size:13px;padding:3px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer}
.chip.on{border-color:var(--a);background:var(--a-soft);color:var(--a);font-weight:600}
.grp{margin-bottom:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.grp span.g{font-size:11.5px;color:var(--muted);min-width:64px}
.res{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:8px 10px;margin-top:6px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.row .w{min-width:84px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--a)}
.row .s{min-width:34px;text-align:right;color:var(--muted)}
.why{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.why b{color:var(--text)}
</style>
</head>
<body class="dark">
<script>
(function(){var t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.body.classList.remove('dark');document.body.classList.add(t);})();
</script>
<p class="cap">단어를 눌러 보세요. 노트북 1-5와 같은 공개 한국어 벡터에서 가장 비슷한 단어 여섯 개다</p>
<div id="groups"></div>
<div class="res"><div id="rows"></div><p class="why" id="why"></p></div>
<script>
var fromParent=false;
addEventListener('message',function(e){if(e.data&&e.data.type==='starlight-theme'){fromParent=true;document.body.classList.remove('light','dark');document.body.classList.add(e.data.theme==='light'?'light':'dark');}});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(ev){if(!fromParent){document.body.classList.remove('light','dark');document.body.classList.add(ev.matches?'light':'dark');}});}catch(_){}
parent.postMessage({type:'figure-ready'},'*');
var NB={"한라산": [["지리산", 0.5], ["설악산", 0.45], ["제주도", 0.45], ["태백산", 0.45], ["제주도의", 0.42], ["성산일출봉", 0.42]], "감귤": [["과일", 0.56], ["귤", 0.54], ["포도", 0.53], ["참외", 0.52], ["망고", 0.51], ["녹차", 0.51]], "고기국수": [["갈치조림", 0.68], ["흑돼지", 0.63], ["전복죽", 0.6], ["옥돔", 0.56], ["돈까스", 0.53], ["해물", 0.52]], "돌하르방": [["제주도", 0.51], ["흑돼지", 0.49], ["제주도의", 0.47], ["올레길", 0.43], ["제주", 0.42], ["유채꽃", 0.41]], "해녀": [["제주", 0.53], ["협재", 0.49], ["어부", 0.48], ["흑돼지", 0.47], ["옥돔", 0.45], ["제주도", 0.44]], "하영": [["채영", 0.54], ["효린", 0.53], ["나연", 0.52], ["하은", 0.51], ["민아", 0.49], ["직찍", 0.48]], "지슬": [["명량", 0.55], ["곡성", 0.48], ["영화", 0.47], ["옥자", 0.46], ["미생", 0.45], ["청불", 0.44]], "오름": [["암벽", 0.42], ["올레길", 0.42], ["올라", 0.4], ["솟아", 0.39], ["오르다", 0.39], ["오를", 0.39]]},G=[["잘 맞음", ["한라산", "감귤"]], ["여행 문맥", ["고기국수", "돌하르방", "해녀"]], ["다른 뜻", ["하영", "지슬", "오름"]], ["받지 못함", ["몸국", "바당", "혼저"]]],WHY={"한라산": "지리산, 설악산, 태백산처럼 <b>같은 자리에 쓰이는 산 이름</b>이 모였다. 사람의 예상과 맞는다", "감귤": "과일, 귤, 포도, 참외, 망고. <b>과일끼리</b> 모였다. 사람의 예상과 맞는다", "고기국수": "같은 국수인 칼국수(0.46)보다 <b>갈치조림(0.68), 흑돼지, 전복죽</b>이 먼저 나온다. 제주 여행 글에서 맛집으로 함께 소개되기 때문이다. 음식의 종류가 아니라 <b>함께 쓰인 글</b>이 이웃을 정한다", "돌하르방": "돌하르방이 무엇인지보다 <b>제주 여행 글에 함께 나오는 말</b>(제주도, 흑돼지, 올레길, 유채꽃)이 모였다", "해녀": "하는 일이 비슷한 어부도 있지만, 대부분 협재, 흑돼지, 옥돔처럼 <b>제주 여행 말</b>이다", "하영": "제주어로 '많이'지만 웹 문서에서는 <b>사람 이름</b>으로 훨씬 많이 쓰여 이름들과 모였다. 하영~많이는 0.17이다", "지슬": "제주어로 '감자'지만 <b>같은 제목의 영화</b> 때문에 영화 제목들과 모였다. 지슬~감자는 0.34이다", "오름": "제주의 작은 화산보다 <b>'오르다'의 뜻</b>으로 쓰인 글이 많아 암벽, 올라, 오르다가 모였다. 올레길처럼 제주 말도 섞였다", "몸국": "200만 단어 중 <b>1,170,703번째</b>로 아주 드물다. 노트북이 받는 앞쪽 60만 단어 밖에 있어 벡터를 받지 못했다", "바당": "바다의 제주어다. 공개 벡터의 <b>200만 단어 전체에 없다.</b> 방언은 웹 문서에 드물다", "혼저": "'어서'의 제주어다. <b>200만 단어 전체에 없다.</b> 인사말을 붙여 쓴 혼저옵서예만 1,337,469번째에 있다"};
var cur='고기국수';
function render(){
 document.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b.dataset.w===cur)});
 var r=document.getElementById('rows');
 if(NB[cur]){r.innerHTML=NB[cur].map(function(p){return '<div class="row"><span class="w">'+p[0]+'</span><span class="bar"><i style="width:'+(p[1]*100)+'%"></i></span><span class="s">'+p[1].toFixed(2)+'</span></div>'}).join('')}
 else{r.innerHTML='<div class="row">'+cur+' 은(는) 노트북이 받은 단어에 없다</div>'}
 document.getElementById('why').innerHTML=WHY[cur];
}
var gEl=document.getElementById('groups');
G.forEach(function(g){var d=document.createElement('div');d.className='grp';d.innerHTML='<span class="g">'+g[0]+'</span>';
 g[1].forEach(function(w){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=w;b.dataset.w=w;b.onclick=function(){cur=w;render()};d.appendChild(b)});gEl.appendChild(d)});
render();
</script>
</body>
</html>
