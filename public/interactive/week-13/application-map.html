<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>응용별 입력과 출력</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.65 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:19px;margin:0 0 8px}p{margin:8px 0}select,button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:100%}select{width:100%;margin:5px 0 12px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.result{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-wrap:anywhere}.card strong{display:block;margin-bottom:5px}.result{margin:12px 0}.small{font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}@media(max-width:450px){.grid{grid-template-columns:1fr}body{padding:12px}}</style></head><body class="dark"><h1>응용별 입력과 출력</h1><p>응용을 고르면 입력·출력·연결 개념이 달라지는 교육용 설명. 실제 모델 실행 없음.</p><label for="choice">살펴볼 상황</label><select id="choice"><option>번역</option><option>챗봇</option><option>음성인식</option><option>멀티모달</option></select><div class="grid"><section class="card"><strong>입력·현재 근거</strong><div id="input"></div></section><section class="card"><strong>출력·확인 범위</strong><div id="output"></div></section></div><p class="result"><strong>연결 개념·단계</strong><br><span id="concept"></span></p><div class="controls"><button id="reveal" type="button" aria-pressed="false" aria-controls="detail">확인 위치 보기·접기</button></div><p class="result" id="detail" aria-live="polite"></p><p class="small">표시 내용은 사람이 작성한 학습용 해설. 모델 출력이나 성능 수치가 아님.</p><script>const cases={"번역": {"input": "공식 안내의 영어 발췌", "output": "같은 의미의 한국어 문장", "concept": "2주차 토큰·한국어 조사, 8주차 의미 표현, 9주차 문맥", "check": "숫자·단위·해발 기준과 추가 주장을 원문에 대조. 자연스러움과 의미 보존은 다른 항목."}, "챗봇": {"input": "높이 질문과 제공된 공식 안내", "output": "질문에 필요한 정보와 근거 위치", "concept": "8주차 검색, 10주차 모델 활용, 12주차 프롬프트·근거 대조", "check": "검색 후보가 질문에 맞는지, 출력에 근거가 있는지, 현재 전달 가능한지 각각 확인."}, "음성인식": {"input": "이용이 허가된 말소리", "output": "실제로 들린 말의 텍스트", "concept": "2주차 언어 자료와 전처리, 9주차 순서·문맥", "check": "실제 음성과 전사 비교가 필요. 방언 텍스트 대응쌍만으로 음성 성능을 확인한 것이 아님."}, "멀티모달": {"input": "안내판 이미지와 글 질문", "output": "입력에서 확인 가능한 설명·답변", "concept": "8주차 표현, 9주차 문맥, 12주차 근거 대조", "check": "글자 인식과 날짜·장소·현재 유효성 판단을 구분. 사진에 없는 정보는 추가 확인."}};let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});const choice=document.getElementById('choice'),detail=document.getElementById('detail'),btn=document.getElementById('reveal');function reset(){const c=cases[choice.value];document.getElementById('input').textContent=c.input;document.getElementById('output').textContent=c.output;document.getElementById('concept').textContent=c.concept;detail.textContent='확인할 위치를 스스로 생각한 뒤 버튼 선택.';btn.setAttribute('aria-pressed','false')}choice.addEventListener('change',reset);btn.addEventListener('click',()=>{const show=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',String(show));detail.textContent=show?cases[choice.value].check:'확인할 위치를 스스로 생각한 뒤 버튼 선택.'});reset();parent.postMessage({type:'figure-ready'},'*');</script></body></html>
