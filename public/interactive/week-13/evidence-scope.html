<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>무슨 범위까지 확인했는가</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.65 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:19px;margin:0 0 8px}p{margin:8px 0}select,button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:100%}select{width:100%;margin:5px 0 12px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.result{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-wrap:anywhere}.card strong{display:block;margin-bottom:5px}.result{margin:12px 0}.small{font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}@media(max-width:450px){.grid{grid-template-columns:1fr}body{padding:12px}}</style></head><body class="dark"><h1>무슨 범위까지 확인했는가</h1><p>올레 자료의 충돌 상황으로 확인 범위를 고르는 교육용 점검. 공식 페이지 실시간 조회·모델 실행 없음.</p><label for="choice">살펴볼 상황</label><select id="choice"><option>상세 발췌와 출력 대조</option><option>페이지 전체의 일관성 확인</option><option>현재 거리 확정</option><option>오늘 안전한 이동 권고</option></select><div class="grid"><section class="card"><strong>입력·현재 근거</strong><div id="input"></div></section><section class="card"><strong>출력·확인 범위</strong><div id="output"></div></section></div><p class="result"><strong>연결 개념·단계</strong><br><span id="concept"></span></p><div class="controls"><button id="reveal" type="button" aria-pressed="false" aria-controls="detail">확인 위치 보기·접기</button></div><p class="result" id="detail" aria-live="polite"></p><p class="small">표시 내용은 사람이 작성한 학습용 해설. 모델 출력이나 성능 수치가 아님.</p><script>const cases={"상세 발췌와 출력 대조": {"input": "한 가지 제공 발췌와 실제 출력이 있는 조건", "output": "그 발췌의 숫자·단위와 출력의 일치 확인", "concept": "12주차 근거 대조", "check": "제공된 발췌에 대한 일치 확인 가능. 실제 최신 코스 거리까지 확인한 결론은 아님."}, "페이지 전체의 일관성 확인": {"input": "공식 페이지 상단과 상세 본문", "output": "거리 표기가 서로 다르다는 기록", "concept": "자료 범위·원문 대조", "check": "충돌 발견은 조사 결과. 어느 값을 선택해야 하는지 이 발견만으로 결정하지 않음."}, "현재 거리 확정": {"input": "충돌하는 상단·본문 표기만 확보", "output": "추가 확인 전 판단 보류", "concept": "근거의 적용 범위·사람 확인", "check": "최신 공식 확인 필요. 평균이나 모델 선택으로 현재 거리를 확정하지 않음."}, "오늘 안전한 이동 권고": {"input": "소개 페이지의 거리 표현만 확보", "output": "현재 상황의 행동 권고 보류", "concept": "질문 범위·시점·책임", "check": "날씨·통제·이용자 상황 등 질문에 필요한 근거 미확보. 거리 확인과 안전 판단은 다른 일."}};let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});const choice=document.getElementById('choice'),detail=document.getElementById('detail'),btn=document.getElementById('reveal');function reset(){const c=cases[choice.value];document.getElementById('input').textContent=c.input;document.getElementById('output').textContent=c.output;document.getElementById('concept').textContent=c.concept;detail.textContent='확인할 위치를 스스로 생각한 뒤 버튼 선택.';btn.setAttribute('aria-pressed','false')}choice.addEventListener('change',reset);btn.addEventListener('click',()=>{const show=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',String(show));detail.textContent=show?cases[choice.value].check:'확인할 위치를 스스로 생각한 뒤 버튼 선택.'});reset();parent.postMessage({type:'figure-ready'},'*');</script></body></html>
