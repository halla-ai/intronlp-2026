<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>사람의 확인 위치</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.65 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:19px;margin:0 0 8px}p{margin:8px 0}select,button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:100%}select{width:100%;margin:5px 0 12px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.result{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow-wrap:anywhere}.card strong{display:block;margin-bottom:5px}.result{margin:12px 0}.small{font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}@media(max-width:450px){.grid{grid-template-columns:1fr}body{padding:12px}}</style></head><body class="dark"><h1>사람의 확인 위치</h1><p>상정 상황에서 무엇을 더 확인할지 고르는 교육용 분기. 실제 모델 평가·운영 서비스 없음.</p><label for="choice">살펴볼 상황</label><select id="choice"><option>발췌의 높이 질문</option><option>거리 표기 충돌</option><option>모델 미실행</option><option>날짜 없는 안내판 사진</option></select><div class="grid"><section class="card"><strong>입력·현재 근거</strong><div id="input"></div></section><section class="card"><strong>출력·확인 범위</strong><div id="output"></div></section></div><p class="result"><strong>연결 개념·단계</strong><br><span id="concept"></span></p><div class="controls"><button id="reveal" type="button" aria-pressed="false" aria-controls="detail">확인 위치 보기·접기</button></div><p class="result" id="detail" aria-live="polite"></p><p class="small">표시 내용은 사람이 작성한 학습용 해설. 모델 출력이나 성능 수치가 아님.</p><script>const cases={"발췌의 높이 질문": {"input": "높이·단위가 있는 원문과 실제 출력", "output": "숫자·단위·추가 주장 대조", "concept": "자료 확인→출력 확인→전달 판단", "check": "먼저 출력의 각 주장과 원문 비교. 발췌에 없는 예약·시간 정보를 추가했다면 해당 부분 확인 불가."}, "거리 표기 충돌": {"input": "서로 다른 두 원문 표기", "output": "최신 공식 확인까지 거리 확정 보류", "concept": "근거 충돌→사람의 추가 확인", "check": "어느 표기가 현재 적용되는지 추가 확인. 모델의 유창한 선택은 충돌 해소 근거가 아님."}, "모델 미실행": {"input": "자료와 계획만 있고 실제 출력 없음", "output": "미실행 표시와 다음 검증 계획", "concept": "증거 상태→실험 범위 확인", "check": "예상 형식은 계획으로 표시. 정확도나 개선 효과를 만들지 않고 실행 조건·확인 항목 준비."}, "날짜 없는 안내판 사진": {"input": "안내판 그림이나 사진만 확보", "output": "내용 관찰과 현재 유효성 판단 분리", "concept": "입력 관찰→출처·시점 확인", "check": "보이는 글자는 관찰 가능하나 현재 유효성은 미확인. 출처·촬영 날짜·최신 공식 공지 확인."}};let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});const choice=document.getElementById('choice'),detail=document.getElementById('detail'),btn=document.getElementById('reveal');function reset(){const c=cases[choice.value];document.getElementById('input').textContent=c.input;document.getElementById('output').textContent=c.output;document.getElementById('concept').textContent=c.concept;detail.textContent='확인할 위치를 스스로 생각한 뒤 버튼 선택.';btn.setAttribute('aria-pressed','false')}choice.addEventListener('change',reset);btn.addEventListener('click',()=>{const show=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',String(show));detail.textContent=show?cases[choice.value].check:'확인할 위치를 스스로 생각한 뒤 버튼 선택.'});reset();parent.postMessage({type:'figure-ready'},'*');</script></body></html>
