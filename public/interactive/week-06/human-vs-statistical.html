<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사람의 눈과 통계의 눈</title>
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px;overflow:hidden;font-size:13.5px;line-height:1.5}
body.light{--bg:#ffffff;--card:#f6f8fa;--text:#1f2328;--muted:#57606a;--border:#d0d7de;--a:#2563eb;--a-soft:rgba(37,99,235,.10);--err:#dc2626;--err-soft:rgba(220,38,38,.10)}
body.dark{--bg:#080808;--card:#141414;--text:#ededed;--muted:#9ca3af;--border:#2c2c2c;--a:#22d3ee;--a-soft:rgba(34,211,238,.12);--err:#f87171;--err-soft:rgba(248,113,113,.13)}
.cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:10px}
.panel h3{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{color:var(--muted);font-size:10.5px;font-weight:400}
.pairs{display:flex;flex-direction:column;gap:6px}
.pr{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:var(--bg);font-size:12.5px;cursor:pointer;transition:border-color .2s,background .2s;font-family:inherit;color:var(--text);text-align:left}
.pr:hover{border-color:var(--muted)}
.pr.sel{background:var(--a-soft);border-color:var(--a)}
.pr .pair{font-weight:600}
.pr .sim{font-size:13px;min-width:36px;text-align:right}
.pr.similar .sim{color:var(--a)}
.pr.mismatch .sim{color:var(--err)}
.pr .tag{font-size:10.5px;color:var(--muted);margin-left:6px;font-weight:400}
.explain{margin:10px 0 0;padding:8px 10px;border:1px dashed var(--border);border-radius:10px;font-size:12.5px;color:var(--muted);min-height:52px}
.explain b{color:var(--text)}
.explain .big{font-size:16px;font-weight:700;margin-right:4px}
</style>
</head>
<body class="dark">
<script>
(function(){var t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.body.classList.remove('dark');document.body.classList.add(t);})();
</script>
<p class="cap">좌우의 단어 쌍을 눌러 비교해 보세요. 사람이 느끼는 비슷함과 숫자가 말해 주는 비슷함이 다른 자리가 있다</p>
<div class="grid">
  <div class="panel">
    <h3>사람의 눈 <small>같은 과일, 같은 음식</small></h3>
    <div class="pairs" id="human"></div>
  </div>
  <div class="panel">
    <h3>통계의 눈 <small>동시발생 행렬의 코사인 유사도</small></h3>
    <div class="pairs" id="stat"></div>
  </div>
</div>
<div class="explain" id="explain">단어 쌍을 누르면 이유가 나타난다</div>
<script>
var fromParent=false;
addEventListener('message',function(e){if(e.data&&e.data.type==='starlight-theme'){fromParent=true;document.body.classList.remove('light','dark');document.body.classList.add(e.data.theme==='light'?'light':'dark');}});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(ev){if(!fromParent){document.body.classList.remove('light','dark');document.body.classList.add(ev.matches?'light':'dark');}});}catch(_){}
parent.postMessage({type:'figure-ready'},'*');

// cosine similarities computed by notebooks/week-06.ipynb (scripts/gen_week06.py), window 2
var EX={
 "귤을~귤은":{sim:'0.00',kind:'mismatch',why:'사람은 <b>둘 다 귤</b>이라 비슷하다고 느낀다. 그런데 말뭉치에서 귤을은 귤밭에서·따왔다와, 귤은은 겨울·달고와만 함께 다닌다. <b>겹치는 이웃이 하나도 없어</b> 유사도가 0.00이 나왔다. 같은 대상을 가리켜도 조사와 어미가 갈라 놓으면 통계는 알아보지 못한다'},
 "귤을~감귤":{sim:'0.00',kind:'mismatch',why:'사람에게는 같은 과일이다. 그런데 감귤은 상자를·포장해와만 함께 다녔다. <b>겹치는 이웃이 없어 0.00</b>. 말뭉치 13문장에서는 우연이 크게 작동한다'},
 "고기국수를~갈치조림을":{sim:'0.50',kind:'similar',why:'둘 다 <b>먹었다</b>와 함께 다니는 음식이다. 공유하는 이웃이 있어 유사도가 0.50으로 올라갔다. 분포 가설이 맞는 경우다'},
 "바다가~하늘이":{sim:'0.41',kind:'similar',why:'둘 다 <b>아주·푸르다</b>와 함께 다닌다. "바다가 푸르다", "하늘이 푸르다"처럼 같은 자리에 끼어 들었기 때문이다. 분포 가설이 맞는 경우다'}
};
var HUMAN={ "귤을~귤은":"비슷하다", "귤을~감귤":"비슷하다", "고기국수를~갈치조림을":"비슷하다", "바다가~하늘이":"다른가? 비슷한 자리" };
var STAT={ "귤을~귤은":'0.00', "귤을~감귤":'0.00', "고기국수를~갈치조림을":'0.50', "바다가~하늘이":'0.41' };
var humanEl=document.getElementById('human'),statEl=document.getElementById('stat'),exEl=document.getElementById('explain');
function build(el,order){
 order.forEach(function(k){
  var d=document.createElement('button');d.type='button';d.className='pr '+EX[k].kind;d.dataset.k=k;
  d.innerHTML='<span class="pair">'+k.replace('~',' ~ ')+'</span><span class="sim">'+STAT[k]+'</span>';
  d.onclick=function(){select(k)};
  el.appendChild(d);
 });
}
build(humanEl,["귤을~귤은","귤을~감귤","고기국수를~갈치조림을","바다가~하늘이"]);
build(statEl,["고기국수를~갈치조림을","바다가~하늘이","귤을~귤은","귤을~감귤"]);
function select(k){
 document.querySelectorAll('.pr').forEach(function(b){b.classList.toggle('sel',b.dataset.k===k)});
 var e=EX[k];
 exEl.innerHTML='<span class="big">'+e.sim+'</span>'+e.why;
}
select("귤을~귤은");
</script>
</body>
</html>
