<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창을 넓히면 유사도가 달라진다</title>
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px;overflow:hidden;font-size:13.5px;line-height:1.5}
body.light{--bg:#ffffff;--card:#f6f8fa;--text:#1f2328;--muted:#57606a;--border:#d0d7de;--a:#2563eb;--a-soft:rgba(37,99,235,.10);--pos:#16a34a;--pos-soft:rgba(22,163,74,.12);--err:#dc2626;--err-soft:rgba(220,38,38,.10)}
body.dark{--bg:#080808;--card:#141414;--text:#ededed;--muted:#9ca3af;--border:#2c2c2c;--a:#22d3ee;--a-soft:rgba(34,211,238,.12);--pos:#4ade80;--pos-soft:rgba(74,222,128,.14);--err:#f87171;--err-soft:rgba(248,113,113,.13)}
.cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.sl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sl label{font-size:12.5px;color:var(--muted);white-space:nowrap}
.sl input{flex:1;accent-color:var(--a)}
.sl .v{font-size:13px;min-width:70px;font-weight:600;color:var(--a)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center}
th{background:var(--card);font-weight:600}
td .vv{font-size:13.5px;font-weight:700}
td.zero .vv{color:var(--err)}
td.rise .vv{color:var(--pos)}
td.rise{background:var(--pos-soft)}
td.zero{background:var(--err-soft)}
td.fall .vv{color:var(--err)}
td.cur{outline:2px solid var(--muted);outline-offset:-2px}
.note{margin:10px 0 0;font-size:12.5px;color:var(--muted);min-height:52px}
.note b{color:var(--text)}
</style>
</head>
<body class="dark">
<script>
(function(){var t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.body.classList.remove('dark');document.body.classList.add(t);})();
</script>
<p class="cap">창(window)을 옮겨 보세요. 테두리가 지금 창이다. 창 1보다 오른 값은 초록 ↑, 내려간 값은 빨강 ↓, 0.00은 붉은 바탕이다</p>
<div class="sl">
  <label for="w">창 크기</label>
  <input type="range" id="w" min="1" max="3" step="1" value="2">
  <span class="v" id="wv">창 2칸</span>
</div>
<table>
<tr><th>단어 쌍</th><th id="h1">창 2</th><th id="h2"></th><th id="h3"></th></tr>
<tr><th style="text-align:left">고기국수를 ~ 갈치조림을</th><td id="p1a"></td><td id="p1b"></td><td id="p1c"></td></tr>
<tr><th style="text-align:left">바다가 ~ 하늘이</th><td id="p2a"></td><td id="p2b"></td><td id="p2c"></td></tr>
<tr><th style="text-align:left">귤을 ~ 귤은</th><td id="p3a"></td><td id="p3b"></td><td id="p3c"></td></tr>
<tr><th style="text-align:left">귤은 ~ 하늘에</th><td id="p4a"></td><td id="p4b"></td><td id="p4c"></td></tr>
</table>
<p class="note" id="note"></p>
<script>
var fromParent=false;
addEventListener('message',function(e){if(e.data&&e.data.type==='starlight-theme'){fromParent=true;document.body.classList.remove('light','dark');document.body.classList.add(e.data.theme==='light'?'light':'dark');}});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(ev){if(!fromParent){document.body.classList.remove('light','dark');document.body.classList.add(ev.matches?'light':'dark');}});}catch(_){}
parent.postMessage({type:'figure-ready'},'*');

// cosine similarities per window, computed by notebooks/week-06.ipynb (scripts/gen_week06.py) over the 13-sentence Jeju corpus
var S={
 "p1":{w1:'0.00',w2:'0.50',w3:'0.50'},
 "p2":{w1:'0.29',w2:'0.41',w3:'0.41'},
 "p3":{w1:'0.00',w2:'0.00',w3:'0.00'},
 "p4":{w1:'0.50',w2:'0.33',w3:'0.25'}
};
var sl=document.getElementById('w'),wv=document.getElementById('wv');
function render(){
 var w=parseInt(sl.value);
 wv.textContent='창 '+w+'칸';
 ['h1','h2','h3'].forEach(function(id,i){document.getElementById(id).textContent='창 '+(i+1)+(i+1===w?' (지금)':'')});
 ['1','2','3','4'].forEach(function(n){
  var key='p'+n;
  ['a','b','c'].forEach(function(sub,i){
   var cell=document.getElementById(key+sub);
   var val=S[key]['w'+(i+1)];
   var base=parseFloat(S[key].w1),v=parseFloat(val);
   // arrows repeat the colour signal for readers who cannot tell green from red
   cell.innerHTML='<span class="vv">'+val+(v>base?' ↑':v<base&&v>0?' ↓':'')+'</span>';
   // compare each window with window 1: rise, fall, or zero
   cell.className=(i+1===w?'cur ':'')+(v===0?'zero':v>base?'rise':v<base?'fall':'');
  });
 });
 var notes={
  1:'창 1에서는 고기국수를과 갈치조림을의 이웃이 각각 뜨겁게, 뜨끈하게뿐이라 <b>유사도가 0.00</b>이다. 반대로 귤은~하늘에는 이웃 둘 중 겨울 하나를 공유해 0.50이다',
  2:'창 2부터 <b>먹었다</b>가 두 음식의 공유 이웃으로 들어와 유사도가 0.50으로 올라간다. 바다가~하늘이도 푸르다가 더해져 0.41이 된다. 그런데 귤은~하늘에는 0.33으로 <b>내려간다.</b> 겹치지 않는 이웃이 새로 늘었기 때문이다',
  3:'귤을~귤은은 창을 3칸으로 넓혀도 0.00이다. <b>겹치는 이웃이 생기지 않는 것은 창의 문제가 아니라 말뭉치의 문제다.</b> 귤은~하늘에는 0.25까지 더 내려간다. <b>창을 넓힌다고 유사도가 늘 오르는 것은 아니다</b>'
 };
 document.getElementById('note').innerHTML=notes[w];
}
sl.addEventListener('input',render);
render();
</script>
</body>
</html>
