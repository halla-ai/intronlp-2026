<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>무엇을 먼저 바꿀까</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{max-width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note,.result{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.result{background:var(--card);white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:12px;opacity:.8}label{display:block;margin-bottom:5px}</style></head><body class="dark"><h1>무엇을 먼저 바꿀까</h1><p>인력·예산이 적은 도내 조직을 상정한 교육용 판단표. 실제 기업 데이터나 비용 측정 없음.</p><label for="condition">필요한 변화 선택</label><select id="condition"><option value="format">답의 형식과 확인 불가 처리 개선</option><option value="facts">새 공개 안내 내용을 반영</option><option value="repeat">반복 과제가 지시만으로 해결되지 않음</option></select><p id="result" class="result" aria-live="polite"></p><p class="note">프롬프트는 입력을, 미세조정은 가중치를 바꾸는 과정. 어느 쪽도 사실성 보장은 없음.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const answers={format:'먼저 프롬프트의 출력 항목과 예시를 작은 자료에서 시험. 작성·검토 시간과 입력 길이에 따른 추론 부담 기록.',facts:'확인한 최신 자료를 입력에 제공하고 원문 대조. 관련 자료를 찾아 생성과 연결하는 RAG의 개념과 연결되지만, 여기서는 검색 구현 없음.',repeat:'실패한 과제와 실제 출력부터 기록. 미세조정은 학습 자료·환경·평가·유지 비용 준비가 필요. 한 번의 실패로 학습이 반드시 필요하다고 단정하지 않기.'};function render(){document.getElementById('result').textContent=answers[document.getElementById('condition').value]}document.getElementById('condition').onchange=render;render();</script></body></html>
