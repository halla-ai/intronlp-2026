<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>원문이 답을 뒷받침하는가</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{max-width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note,.result{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.result{background:var(--card);white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:12px;opacity:.8}label{display:block;margin-bottom:5px}</style></head><body class="dark"><h1>원문이 답을 뒷받침하는가</h1><p>주어진 발췌의 근거 유무를 고르는 교육용 점검. 실제 모델 답과 구분.</p><label for="question">공통 질문 선택</label><select id="question"><option value="height">한라산 높이는?</option><option value="length">올레 6코스 거리는?</option><option value="hours">올레 6코스 걷는 시간은?</option></select><div class="controls"><button type="button" id="supported">발췌로 확인 가능</button><button type="button" id="unknown">발췌로 확인 불가</button></div><p id="source" class="result"></p><p id="result" class="note" aria-live="polite">판단 버튼을 선택한 뒤 근거 확인.</p><p class="small">출처 ID가 붙었다는 사실만으로 확인 완료가 아님. 실제 모델 출력의 숫자·단위·근거를 대조.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const cases={height:{supported:true,text:'H: 높이 1,950 m와 해발 표현이 있는 발췌.',explain:'원문의 높이와 단위 대조 가능. 답이 다른 숫자를 쓰면 불일치로 기록.'},length:{supported:true,text:'O: 거리 11-kilometer 표현이 있는 발췌.',explain:'원문의 거리와 단위 대조 가능. 이동 시간의 근거와는 다른 정보.'},hours:{supported:false,text:'H와 O: 이동 소요시간 표현 없음.',explain:'거리만으로 걷는 시간을 정할 근거 없음. 모델이 시간을 적었다면 이 발췌에서는 확인 불가.'}};const question=document.getElementById('question');function reset(){document.getElementById('source').textContent=cases[question.value].text;document.getElementById('result').textContent='판단 버튼을 선택한 뒤 근거 확인.'}function answer(value){const c=cases[question.value];document.getElementById('result').textContent=(value===c.supported?'판단과 근거 일치. ':'다시 확인할 점. ')+c.explain}question.onchange=reset;document.getElementById('supported').onclick=()=>answer(true);document.getElementById('unknown').onclick=()=>answer(false);reset();</script></body></html>
