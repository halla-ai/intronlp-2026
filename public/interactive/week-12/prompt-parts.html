<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>지시에 무엇을 넣을까</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{max-width:100%;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note,.result{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.result{background:var(--card);white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:12px;opacity:.8}label{display:block;margin-bottom:5px}</style></head><body class="dark"><h1>지시에 무엇을 넣을까</h1><p>선택한 지시 조각을 합치는 교육용 그림. 실제 모델 실행 없음.</p><div class="controls" id="parts"><button type="button" data-part="purpose" aria-pressed="true">목적</button><button type="button" data-part="source" aria-pressed="true">자료</button><button type="button" data-part="constraint" aria-pressed="true">제약</button><button type="button" data-part="format" aria-pressed="true">출력</button><button type="button" data-part="evidence" aria-pressed="true">근거</button></div><div class="result" id="result" aria-live="polite"></div><p class="note" id="note" aria-live="polite"></p><p class="small">지시가 구체적이어도 실제 출력의 사실성·형식 준수는 따로 확인.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const pieces={purpose:'목적: 공개 안내를 바탕으로 방문자의 질문에 답변.',source:'자료: 출처 H(한라산 높이)와 O(올레 6코스 거리)의 발췌 사용.',constraint:'제약: 발췌에 없는 정보는 확인 불가로 표시.',format:'출력: 답변 | 출처 ID | 근거.',evidence:'근거: 원문의 해당 표현과 숫자·단위 대조.'};const buttons=[...document.querySelectorAll('[data-part]')];function render(){const active=buttons.filter(b=>b.getAttribute('aria-pressed')==='true');document.getElementById('result').textContent=active.length?active.map(b=>pieces[b.dataset.part]).join('\n'):'추가한 지시 조각 없음.';document.getElementById('note').textContent=active.length===5?'다섯 부분 포함. 실제 실행에서 지시를 따르는지는 별도 확인.':'빠진 부분: '+buttons.filter(b=>b.getAttribute('aria-pressed')!=='true').map(b=>b.textContent).join(', ')+'. 어떤 문제가 생길지 먼저 예상한 뒤 실제 결과와 대조.';}buttons.forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');render()});render();</script></body></html>
