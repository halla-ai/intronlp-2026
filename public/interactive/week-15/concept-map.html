<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>한 학기 개념의 연결</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:18px;font:15px/1.65 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#222831;--card:#f2f5f7;--line:#bbc4ce;--accent:#125689;--soft:#e7f1f6}body.dark{--bg:#080808;--fg:#eee;--card:#1a2028;--line:#65717e;--accent:#91dcf5;--soft:#233b47}h1{font-size:20px;margin:0 0 8px}h2{font-size:17px;margin:0 0 6px}p{margin:8px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--fg);cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{padding:14px;border:1px solid var(--line);border-radius:10px;min-width:0;background:var(--card);overflow-wrap:anywhere}.label{font-size:13px;color:var(--accent);margin:0 0 5px}.note{font-size:13px;margin-top:12px}ol{padding-left:23px;margin:5px 0}li{margin:6px 0}@media(max-width:540px){body{padding:12px}.panels{grid-template-columns:1fr}button{font-size:14px}h1{font-size:18px}}</style></head><body class="dark"><h1>한 학기 개념의 연결</h1><p>한 마디를 골라 이전 개념·사용 과제·남는 한계를 연결. 순위표나 모델 실행 결과가 아닌 교육용 안내.</p><div class="controls" aria-label="학습할 항목 선택"><button type="button" data-index="0" aria-pressed="true">말뭉치</button><button type="button" data-index="1" aria-pressed="false">통계적 모델링</button><button type="button" data-index="2" aria-pressed="false">의미 표현</button><button type="button" data-index="3" aria-pressed="false">신경망·트랜스포머</button><button type="button" data-index="4" aria-pressed="false">사전학습</button><button type="button" data-index="5" aria-pressed="false">LLM 활용</button><button type="button" data-index="6" aria-pressed="false">사회적 함의</button></div><div class="panels" aria-live="polite"><section class="panel"><p class="label">이전 마디와의 연결</p><p id="field-0"></p></section><section class="panel"><p class="label">현재 묻는 질문</p><p id="field-1"></p></section><section class="panel"><p class="label">관찰할 수 있는 것</p><p id="field-2"></p></section><section class="panel"><p class="label">남는 한계</p><p id="field-3"></p></section></div><p class="note">Tab으로 선택 항목 이동, Enter 또는 Space로 선택. 자신의 결과물과 연결할 때 실제 관찰·작성 예시·미확인 상태를 구분.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');const rows=[["말뭉치", "언어 현상에서 어떤 텍스트를 모을지 결정.", "무엇을 누구의 표현으로 모았는가?", "안내문인지 문의인지, 빠진 집단과 표현이 무엇인지 확인.", "공개 안내만 모았다고 모든 방문자의 언어를 대표하지 않음."], ["통계적 모델링", "모은 자료를 토큰으로 나누고 빈도·조건을 셈.", "얼마나 자주 나오며 어떤 앞말 뒤에 나오는가?", "빈도, N-그램 조건, 정해진 범주를 나누는 결과.", "자주 나옴과 사실임은 다름. 처음 본 표현·자료 범위 확인 필요."], ["의미 표현", "함께 나타나는 패턴을 뜻의 단서로 삼아 벡터로 표현.", "표현이 달라도 비슷한 뜻인가?", "단어·문장의 숫자 벡터와 유사도 비교.", "부정·수치가 다르더라도 벡터가 가까울 수 있음. 사실 확인과 구분."], ["신경망·트랜스포머", "숫자 표현을 입력으로 사용해 현재 문맥의 다른 위치 참고.", "이 입력에서 어떤 위치를 얼마나 참고하는가?", "어텐션 가중치의 모양과 입력 변경에 따른 차이.", "가중치만으로 내부 원인이나 외부 사실을 증명하지 못함."], ["사전학습", "모델을 미리 학습한 뒤 현재 입력에 적용.", "현재 과제에 이 모델의 학습 목적이 맞는가?", "기존 모델 실행과 입력·출력의 과제 적합성.", "모델을 불러왔다고 추가 학습을 한 것은 아님. 언어·자료 조건 확인."], ["LLM 활용", "사전학습 모델에 지시·예시·자료를 입력 문맥으로 제공.", "어떤 입력으로 어떤 답을 얻었으며 원문과 맞는가?", "고정 조건에서 지시·예시를 바꾸어 실제 출력 대조.", "예시 추가는 이번 실행에서 가중치 변경이 아님. 사실성 별도 확인."], ["사회적 함의", "출력의 관찰을 사람의 이익·불이익과 판단 경계에 연결.", "누가 영향을 받고 어떤 결론은 보류할 것인가?", "편향·가치 충돌·근거와 사람 검토 경로.", "기술 결과만으로 모든 가치 판단을 끝내거나 책임을 넘길 수 없음."]];const buttons=[...document.querySelectorAll("[data-index]")];function render(index){buttons.forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index)));rows[index].slice(1).forEach((v,i)=>document.getElementById("field-"+i).textContent=v);}buttons.forEach(b=>b.addEventListener("click",()=>render(Number(b.dataset.index))));render(0);</script></body></html>
