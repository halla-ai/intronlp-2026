<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>주장과 근거를 연결하기</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:18px;font:15px/1.65 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#222831;--card:#f2f5f7;--line:#bbc4ce;--accent:#125689;--soft:#e7f1f6}body.dark{--bg:#080808;--fg:#eee;--card:#1a2028;--line:#65717e;--accent:#91dcf5;--soft:#233b47}h1{font-size:20px;margin:0 0 8px}h2{font-size:17px;margin:0 0 6px}p{margin:8px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--fg);cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{padding:14px;border:1px solid var(--line);border-radius:10px;min-width:0;background:var(--card);overflow-wrap:anywhere}.label{font-size:13px;color:var(--accent);margin:0 0 5px}.note{font-size:13px;margin-top:12px}ol{padding-left:23px;margin:5px 0}li{margin:6px 0}@media(max-width:540px){body{padding:12px}.panels{grid-template-columns:1fr}button{font-size:14px}h1{font-size:18px}}</style></head><body class="dark"><h1>주장과 근거를 연결하기</h1><p>사람이 작성한 판단 예시. 실제 모델 출력·최신 현장 확인을 대신하지 않는 안내.</p><div class="controls" aria-label="학습할 항목 선택"><button type="button" data-index="0" aria-pressed="true">높이 발췌</button><button type="button" data-index="1" aria-pressed="false">최신 코스 길이</button><button type="button" data-index="2" aria-pressed="false">걷는 시간</button><button type="button" data-index="3" aria-pressed="false">실행 기록</button></div><div class="panels" aria-live="polite"><section class="panel"><p class="label">발표할 주장</p><p id="field-0"></p></section><section class="panel"><p class="label">현재 있는 자료</p><p id="field-1"></p></section><section class="panel"><p class="label">확인 상태</p><p id="field-2"></p></section><section class="panel"><p class="label">다음 행동</p><p id="field-3"></p></section></div><p class="note">Tab으로 선택 항목 이동, Enter 또는 Space로 선택. 자신의 결과물과 연결할 때 실제 관찰·작성 예시·미확인 상태를 구분.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');const rows=[["높이 발췌", "H 발췌에 한라산 높이가 1,950m로 적혀 있음.", "H: At 1,950 m above sea level ... (앞 주차 제공 발췌).", "발췌 내용 확인 가능. 오늘의 탐방 이용 조건과는 별도 주장.", "숫자·단위·원문 위치를 연결. 운영시간·이용 가능 여부는 추가 확인."], ["최신 코스 길이", "올레 6코스의 실제 최신 길이를 확정하려 함.", "O 상세 본문 발췌 11km, 앞 주차 열람 시 상단 설명 13.3km.", "현재 자료의 표기 충돌. 한 발췌와 일치한다고 최신 길이 확정 불가.", "발췌 일치와 최신 사실의 확인 상태를 나눔. 공식 안내 추가 확인 전 보류."], ["걷는 시간", "올레 6코스를 걷는 시간을 안내하려 함.", "현재 H·O 발췌에는 걷는 시간·속도·휴식 조건 없음.", "제공 자료로 확인 불가. 거리만으로 시간을 만들면 추가 가정 필요.", "시간을 추측해 사실로 넣지 않음. 필요한 원문과 조건을 추가 확인 항목에 기록."], ["실행 기록", "우리 팀의 모델이 이 답을 실제로 생성했다고 말하려 함.", "팀이 실행한 입력·조건·출력 전문이 있어야 관찰 사실로 확인 가능.", "이 그림은 모델을 실행하지 않음. 사람이 쓴 예시는 실제 출력이 아님.", "기존 실행 기록 연결. 기록 없으면 미실행 또는 교육용 예시로 표시."]];const buttons=[...document.querySelectorAll("[data-index]")];function render(index){buttons.forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index)));rows[index].slice(1).forEach((v,i)=>document.getElementById("field-"+i).textContent=v);}buttons.forEach(b=>b.addEventListener("click",()=>render(Number(b.dataset.index))));render(0);</script></body></html>
