<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>현재 근거에서 다음 학습으로</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:18px;font:15px/1.65 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#222831;--card:#f2f5f7;--line:#bbc4ce;--accent:#125689;--soft:#e7f1f6}body.dark{--bg:#080808;--fg:#eee;--card:#1a2028;--line:#65717e;--accent:#91dcf5;--soft:#233b47}h1{font-size:20px;margin:0 0 8px}h2{font-size:17px;margin:0 0 6px}p{margin:8px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--fg);cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.panel{padding:14px;border:1px solid var(--line);border-radius:10px;min-width:0;background:var(--card);overflow-wrap:anywhere}.label{font-size:13px;color:var(--accent);margin:0 0 5px}.note{font-size:13px;margin-top:12px}ol{padding-left:23px;margin:5px 0}li{margin:6px 0}@media(max-width:540px){body{padding:12px}.panels{grid-template-columns:1fr}button{font-size:14px}h1{font-size:18px}}</style></head><body class="dark"><h1>현재 근거에서 다음 학습으로</h1><p>도내 정주를 생각하기 위한 상정 업무. 실제 채용·임금·기관 실적이나 취업 약속이 아닌 학습 계획.</p><div class="controls" aria-label="학습할 항목 선택"><button type="button" data-index="0" aria-pressed="true">공개 자료 정리</button><button type="button" data-index="1" aria-pressed="false">반복 문의 검토</button><button type="button" data-index="2" aria-pressed="false">유사 문서 찾기</button><button type="button" data-index="3" aria-pressed="false">결과 설명·협업</button></div><div class="panels" aria-live="polite"><section class="panel"><p class="label">상정 업무</p><p id="field-0"></p></section><section class="panel"><p class="label">현재 결과물의 근거</p><p id="field-1"></p></section><section class="panel"><p class="label">남은 역량 간격</p><p id="field-2"></p></section><section class="panel"><p class="label">다음 행동과 확인 결과</p><p id="field-3"></p></section></div><p class="note">Tab으로 선택 항목 이동, Enter 또는 Space로 선택. 자신의 결과물과 연결할 때 실제 관찰·작성 예시·미확인 상태를 구분.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}const preference=matchMedia('(prefers-color-scheme: light)');theme(preference.matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});preference.addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');const rows=[["공개 자료 정리", "공식 안내의 출처와 문서 변경을 정리하는 업무 상정.", "자신의 출처·열람일·발췌·가공 기록이 있으면 연결. 없으면 준비 중 표시.", "자료 변경·표기 충돌을 다루는 경험이 아직 부족할 수 있음.", "앞 주차 발췌와 원문을 다시 대조하고 변경 여부·확인 상태를 문서로 남김."], ["반복 문의 검토", "질문이 자료로 답할 수 있는 범위인지 점검하는 업무 상정.", "자신이 작성한 Q1·Q4·Q5 기록에서 질문·근거·보류 이유 확인.", "다양한 이용자 질문과 오류 유형에 대한 검토 경험.", "새 모델 대신 기존 질문 목록을 점검. 답 가능한 질문과 추가 자료가 필요한 질문을 구분한 표 작성."], ["유사 문서 찾기", "표현이 다른 문서를 찾아 원문을 확인하는 업무 상정.", "8주차의 실제 문장 유사도 관찰 기록이 있으면 연결.", "유사도 순위와 실제 관련성·사실성의 차이를 설명하는 경험.", "기존 검색 결과의 원문을 읽고 관련·부정·수치 차이를 구분한 기록 작성. RAG 구현은 후속 과목."], ["결과 설명·협업", "도구 출력과 한계를 다른 사람이 검토하게 설명하는 업무 상정.", "자신의 실행 조건·출력·원문 대조·질의응답 반영 문서.", "오류를 구분하고 담당자에게 검토 요청하는 절차 경험.", "현재 보고서에서 미실행·불일치·부족한 근거를 표시하고 다음 확인 행동으로 연결."]];const buttons=[...document.querySelectorAll("[data-index]")];function render(index){buttons.forEach((b,i)=>b.setAttribute("aria-pressed",String(i===index)));rows[index].slice(1).forEach((v,i)=>document.getElementById("field-"+i).textContent=v);}buttons.forEach(b=>b.addEventListener("click",()=>render(Number(b.dataset.index))));render(0);</script></body></html>
