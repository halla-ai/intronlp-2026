<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장이 단어 가방이 되기</title>
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px;overflow:hidden;font-size:13.5px;line-height:1.5}
body.light{--bg:#ffffff;--card:#f6f8fa;--text:#1f2328;--muted:#57606a;--border:#d0d7de;--accent:#2563eb;--accent-soft:rgba(37,99,235,.10);--num:#16a34a}
body.dark{--bg:#080808;--card:#141414;--text:#ededed;--muted:#9ca3af;--border:#2c2c2c;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.12);--num:#4ade80}
.cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.sentence{display:block;width:100%;font:inherit;color:inherit;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 12px;font-size:15px;text-align:center;margin-bottom:10px;cursor:pointer}
.word{display:inline-block;margin:0 2px;transition:opacity .5s,transform .5s}
.word.fly{opacity:0;transform:translateY(26px) scale(.6)}
.bag{border:1.5px dashed var(--accent);border-radius:10px;background:var(--accent-soft);padding:9px 12px;min-height:96px}
.bag h3{margin:0 0 6px;font-size:12.5px;color:var(--accent)}
.slots{display:flex;flex-wrap:wrap;gap:5px}
.slot{display:flex;align-items:center;gap:3px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:2px 7px;font-size:12.5px;animation:pop .35s ease both}
.slot b{color:var(--num);font-size:12.5px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.note{margin:10px 0 0;color:var(--muted);font-size:12.5px;min-height:18px}
.note b{color:var(--accent)}
</style>
</head>
<body class="dark">
<script>
(function(){var t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.body.classList.remove('dark');document.body.classList.add(t);})();
</script>
<p class="cap" id="cap">문장을 누르면 단어가 가방으로 들어간다. 누를 때마다 다른 문장</p>
<button type="button" class="sentence" id="sentence" aria-describedby="cap"></button>
<div class="bag">
  <h3>단어 가방 (순서 버림)</h3>
  <div class="slots" id="slots"></div>
</div>
<p class="note" id="note">순서는 가방에 담기지 않는다. 가방에는 <b>어떤 단어가 몇 번 나왔는지</b>만 남는다</p>
<script>
var fromParent=false;
addEventListener('message',function(e){if(e.data&&e.data.type==='starlight-theme'){fromParent=true;document.body.classList.remove('light','dark');document.body.classList.add(e.data.theme==='light'?'light':'dark');}});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(ev){if(!fromParent){document.body.classList.remove('light','dark');document.body.classList.add(ev.matches?'light':'dark');}});}catch(_){}
parent.postMessage({type:'figure-ready'},'*');

var S=[
 '바다가 보이는 객실이 정말 좋았다',
 '직원이 불친절하고 방이 더러웠다',
 '조식도 좋았고 뷰도 좋았고 직원도 친절했다'
];
var idx=0,gen=0;
var sent=document.getElementById('sentence'),slots=document.getElementById('slots'),note=document.getElementById('note');
function show(k){
 var s=S[k%S.length],g=++gen;
 sent.innerHTML=s.split(' ').map(function(w){return '<span class="word">'+w+'</span>'}).join(' ');
 slots.innerHTML='';
 note.innerHTML='순서는 가방에 담기지 않는다. 가방에는 <b>어떤 단어가 몇 번 나왔는지</b>만 남는다';
 var words=s.split(' ').filter(function(w,i,a){return a.indexOf(w)===i});
 words.forEach(function(w,j){
  var n=s.split(' ').filter(function(x){return x===w}).length;
  setTimeout(function(){
   if(g!==gen)return; // a newer sentence replaced this one
   var d=document.createElement('span');d.className='slot';d.innerHTML=w+(n>1?' <b>x'+n+'</b>':'');
   slots.appendChild(d);
  },300+j*220);
 });
}
function wordFly(k){
 sent.querySelectorAll('.word').forEach(function(w,j){
  setTimeout(function(){w.classList.add('fly')},j*90);
 });
 setTimeout(function(){show(k)},420); // k is fixed per click, so fast clicks never skip a sentence
}
sent.onclick=function(){wordFly(++idx)};
show(0);</script>
</body>
</html>
