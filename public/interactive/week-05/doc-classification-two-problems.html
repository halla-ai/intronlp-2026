<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다른 문제, 같은 모양</title>
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px;overflow:hidden;font-size:13.5px;line-height:1.5}
body.light{--bg:#ffffff;--card:#f6f8fa;--text:#1f2328;--muted:#57606a;--border:#d0d7de;--accent:#2563eb;--accent-soft:rgba(37,99,235,.10)}
body.dark{--bg:#080808;--card:#141414;--text:#ededed;--muted:#9ca3af;--border:#2c2c2c;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.12)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{border:none;background:none;color:var(--muted);padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;align-items:stretch}
.doc,.cls{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--card);display:flex;flex-direction:column;justify-content:center;transition:opacity .3s,border-color .3s}
.doc small,.cls small{color:var(--muted);font-size:11px;display:block;margin-bottom:2px}
.doc strong,.cls strong{font-size:13px;font-weight:600}
.pipe{grid-row:1/3;grid-column:2;border:1.5px solid var(--accent);border-radius:10px;background:var(--accent-soft);padding:10px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.step{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:12.5px;text-align:center}
.ar{text-align:center;color:var(--muted);font-size:12px;line-height:1}
.dim{opacity:.28}
.note{color:var(--muted);font-size:12.5px;margin:12px 0 0;min-height:36px}
.note b{color:var(--accent)}
</style>
</head>
<body class="dark">
<script>
(function(){var t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.body.classList.remove('dark');document.body.classList.add(t);})();
</script>
<div class="seg">
  <button id="bSpam" class="on" type="button">스팸 필터</button>
  <button id="bRev" type="button">리뷰 감성 분석</button>
</div>
<div class="grid">
  <div class="doc" id="docSpam"><small>입력 문서</small><strong>무료 쿠폰 받으려면 지금 누르세요</strong></div>
  <div class="pipe">
    <div class="step">단어 가방으로 세기</div>
    <div class="ar">↓</div>
    <div class="step">단어 점수를 합한다</div>
    <div class="ar">↓</div>
    <div class="step">문턱과 비교해 판정</div>
  </div>
  <div class="cls" id="clsSpam"><small>클래스</small><strong>스팸 · 정상</strong></div>
  <div class="doc" id="docRev"><small>입력 문서</small><strong>뷰는 좋았지만 방이 좁았다</strong></div>
  <div class="cls" id="clsRev"><small>클래스</small><strong>긍정 · 부정</strong></div>
</div>
<p class="note" id="note"></p>
<script>
function $(id){return document.getElementById(id)}
var fromParent=false;
addEventListener('message',function(e){if(e.data&&e.data.type==='starlight-theme'){fromParent=true;document.body.classList.remove('light','dark');document.body.classList.add(e.data.theme==='light'?'light':'dark');}});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(ev){if(!fromParent){document.body.classList.remove('light','dark');document.body.classList.add(ev.matches?'light':'dark');}});}catch(_){}
parent.postMessage({type:'figure-ready'},'*');

var NOTE={
 spam:'받은 메일함을 지키는 분류다. <b>가운데 세 단계는 그대로</b>고, 바뀌는 것은 들어가는 문서와 나오는 클래스뿐이다',
 rev:'리뷰 한 건을 긍정과 부정으로 나눈다. <b>스팸 필터와 같은 문제 모양</b>이다. 이번 주에 배울 것은 이 공통 모양이다'
};
function setMode(m){
 $('bSpam').classList.toggle('on',m==='spam');
 $('bRev').classList.toggle('on',m==='rev');
 $('docSpam').classList.toggle('dim',m!=='spam');
 $('clsSpam').classList.toggle('dim',m!=='spam');
 $('docRev').classList.toggle('dim',m!=='rev');
 $('clsRev').classList.toggle('dim',m!=='rev');
 $('note').innerHTML=NOTE[m];
}
$('bSpam').onclick=function(){setMode('spam')};
$('bRev').onclick=function(){setMode('rev')};
setMode('spam');
</script>
</body>
</html>
