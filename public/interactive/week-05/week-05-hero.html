<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰를 바구니에 나눠 담기</title>
<style>
@font-face{font-family:'Pretendard';src:url('/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px 16px;overflow:hidden;font-size:13.5px;line-height:1.5}
body.light{--bg:#ffffff;--card:#f6f8fa;--text:#1f2328;--muted:#57606a;--border:#d0d7de;--pos:#16a34a;--pos-soft:rgba(22,163,74,.12);--neg:#dc2626;--neg-soft:rgba(220,38,38,.10)}
body.dark{--bg:#080808;--card:#141414;--text:#ededed;--muted:#9ca3af;--border:#2c2c2c;--pos:#4ade80;--pos-soft:rgba(74,222,128,.14);--neg:#f87171;--neg-soft:rgba(248,113,113,.13)}
.cap{font-size:12px;color:var(--muted);margin:0 0 8px}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;font-size:13px;transition:opacity .45s,transform .45s}
.card:hover{border-color:var(--muted)}
.card.sorted{opacity:0;transform:scale(.85);pointer-events:none}
.tray{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:28px;margin:10px 0}
.chip{border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--card);animation:pop .3s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.hint{color:var(--muted);font-size:12px}
.bags{display:flex;gap:12px}
.bag{flex:1;border:1.5px dashed var(--border);border-radius:10px;padding:8px 10px;min-height:118px}
.bag.pos{border-color:var(--pos)}
.bag.neg{border-color:var(--neg)}
.bag h3{margin:0 0 4px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.bag.pos h3{color:var(--pos)}
.bag.neg h3{color:var(--neg)}
.count{border-radius:999px;padding:0 8px;font-size:11.5px}
.bag.pos .count{background:var(--pos-soft)}
.bag.neg .count{background:var(--neg-soft)}
.item{border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;margin-top:5px;animation:pop .35s ease}
.bag.pos .item{background:var(--pos-soft);border-color:var(--pos)}
.bag.neg .item{background:var(--neg-soft);border-color:var(--neg)}
.done{margin-top:8px;font-size:12.5px;color:var(--muted);min-height:18px}
.reset{border:1px solid var(--border);background:none;color:var(--muted);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.reset:hover{color:var(--text)}
</style>
</head>
<body class="dark">
<script>
(function(){var t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.body.classList.remove('dark');document.body.classList.add(t);})();
</script>
<p class="cap">리뷰 카드를 눌러 보세요. 문장이 단어 조각으로 쪼개진 뒤 바구니에 담긴다</p>
<div class="pool" id="pool"></div>
<div class="tray" id="tray"></div>
<div class="bags">
  <div class="bag pos"><h3>긍정 바구니 <span class="count" id="posCount">0</span></h3><div id="posList"></div></div>
  <div class="bag neg"><h3>부정 바구니 <span class="count" id="negCount">0</span></h3><div id="negList"></div></div>
</div>
<p class="done" id="done"></p>
<button class="reset" id="reset" type="button">처음으로</button>
<script>
function el(id){return document.getElementById(id)}
var fromParent=false;
addEventListener('message',function(e){if(e.data&&e.data.type==='starlight-theme'){fromParent=true;document.body.classList.remove('light','dark');document.body.classList.add(e.data.theme==='light'?'light':'dark');}});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(ev){if(!fromParent){document.body.classList.remove('light','dark');document.body.classList.add(ev.matches?'light':'dark');}});}catch(_){}
parent.postMessage({type:'figure-ready'},'*');

var REV=[
 ['바다가 보이는 객실이 정말 좋았다',1],
 ['조식이 맛있고 직원들이 친절했다',1],
 ['소음이 심해서 잠을 못 잤다',0],
 ['사진과 다르고 좁고 낡았다',0]
];
var pool=el('pool'),tray=el('tray'),gen=0;
function init(){
 gen++;
 el('posList').innerHTML='';el('negList').innerHTML='';
 el('posCount').textContent='0';el('negCount').textContent='0';
 el('done').textContent='';
 tray.innerHTML='<span class="hint">리뷰 카드를 누르면 여기에 단어 조각이 나타난다</span>';
 pool.innerHTML='';
 REV.forEach(function(r,i){
  var b=document.createElement('button');b.className='card';b.type='button';b.textContent=r[0];
  b.onclick=function(){sort(i,b)};
  pool.appendChild(b);
 });
}
function sort(i,b){
 if(b.classList.contains('sorted'))return;
 b.classList.add('sorted');
 var g=gen;
 tray.innerHTML='';
 REV[i][0].split(' ').forEach(function(w,j){
  var c=document.createElement('span');c.className='chip';c.textContent=w;c.style.animationDelay=(j*90)+'ms';
  tray.appendChild(c);
 });
 setTimeout(function(){
  if(g!==gen)return; // reset while this card was moving
  var pos=REV[i][1]===1;
  var list=el(pos?'posList':'negList');
  var it=document.createElement('div');it.className='item';it.textContent=REV[i][0];list.appendChild(it);
  el(pos?'posCount':'negCount').textContent=String(list.children.length);
  if(el('posList').children.length+el('negList').children.length===REV.length)el('done').textContent='글 전체를 두 바구니 중 하나로 나눴다. 이번 주에는 이 판단을 기계가 하도록 만든다';
 },650);
}
el('reset').onclick=init;
init();
</script>
</body>
</html>
