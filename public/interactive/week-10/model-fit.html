<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모델과 과제의 맞음 확인</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls,.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.token.visible{background:var(--soft);border-color:var(--accent)}.token.target{font-weight:700;border:2px solid var(--accent)}.token.hidden{opacity:.45}.note{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.small{font-size:12px;opacity:.8}.result{padding:12px;background:var(--card);border-radius:10px}</style></head><body class="dark"><h1>라벨과 목적부터 확인</h1><label for="task">상정 과제 선택</label><div class="controls"><select id="task"><option value="sentiment">영어 예시 문장의 긍정/부정</option><option value="topic">한국어 문의의 관광/교통 주제</option><option value="draft">영어 창작 글의 이어쓰기</option><option value="facts">정확한 제주 운영시간 안내</option></select></div><p id="result" class="result" aria-live="polite"></p><p class="note">도내 조직은 상정 조건. 실제 기업 데이터 없음. 선택 결과는 학습 과제의 적합성 판단이며 실제 정확도 측정이 아님.</p><p class="small">감정 score는 정확도가 아니며, 자연스러운 생성문은 확인된 사실과 다름.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}theme(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
const answers={sentiment:'이번 감정분류기의 언어와 라벨은 맞는 조건. 다만 영화평에서 학습했으므로 제주 예시의 실제 결과를 확인한 뒤 판단.',topic:'언어와 라벨 모두 다름. 이번 영어 긍정/부정 모델을 관광/교통 분류기로 해석 불가. 필요한 언어와 과제에 맞는 공개 모델부터 확인.',draft:'DistilGPT2의 영어 이어쓰기 과제와 맞는 조건. 반복이나 무관한 내용의 사람 검토 필요.',facts:'이어쓰기만으로 운영시간의 사실성 보장 불가. 공식 공개 안내의 출처 대조와 사람 검토 필요.'};function render(){document.getElementById('result').textContent=answers[document.getElementById('task').value]}document.getElementById('task').onchange=render;render();</script></body></html>
