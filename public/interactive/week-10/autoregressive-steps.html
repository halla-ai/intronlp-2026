<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>한 토큰씩 이어 붙이기</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls,.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.token.visible{background:var(--soft);border-color:var(--accent)}.token.target{font-weight:700;border:2px solid var(--accent)}.token.hidden{opacity:.45}.note{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.small{font-size:12px;opacity:.8}.result{padding:12px;background:var(--card);border-radius:10px}</style></head><body class="dark"><h1>결과를 붙이고 다시 읽기</h1><p class="small">사람이 정한 설명용 이어쓰기. 실제 DistilGPT2 출력이나 토큰 분할 아님.</p><div class="controls"><button id="prev">이전 단계</button><button id="next">다음 단계</button><button id="reset">처음으로</button></div><div id="tokens" class="tokens"></div><p id="step" class="result" aria-live="polite"></p><p class="note">새로 붙인 부분도 다음 단계의 입력. 모델은 이런 과정을 실제 토큰 단위로 반복하며, 글 전체의 사실성을 검사하는 과정은 아님.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}theme(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
let n=0;const start=['A','visitor','in','Jeju'];const continuation=['walks','along','the','coast','.'];function render(){const box=document.getElementById('tokens');box.replaceChildren();start.concat(continuation.slice(0,n)).forEach((w,i)=>{const el=document.createElement('span');el.className='token '+(i>=start.length?'visible':'');el.textContent=w;box.appendChild(el)});document.getElementById('step').textContent=n===0?'0단계: 시작 문장만 주어진 상태.':n+'단계: '+continuation[n-1]+'를 붙인 상태. 이 전체가 다음 예측의 문맥.';document.getElementById('prev').disabled=n===0;document.getElementById('next').disabled=n===continuation.length}document.getElementById('prev').onclick=()=>{n=Math.max(0,n-1);render()};document.getElementById('next').onclick=()=>{n=Math.min(continuation.length,n+1);render()};document.getElementById('reset').onclick=()=>{n=0;render()};render();</script></body></html>
