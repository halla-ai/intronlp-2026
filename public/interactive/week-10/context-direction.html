<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>문맥을 읽는 방향</title><style>@font-face{font-family:Pretendard;src:url('/fonts/PretendardVariable.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;padding:16px;font:14px/1.6 Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--fg)}body.light{--bg:#fff;--fg:#20242a;--card:#f3f5f7;--line:#c5cbd3;--accent:#1d4ed8;--soft:#e4edff}body.dark{--bg:#080808;--fg:#ededed;--card:#181b20;--line:#424852;--accent:#67d7ee;--soft:#18353d}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button,select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls,.tokens{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.token{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.token.visible{background:var(--soft);border-color:var(--accent)}.token.target{font-weight:700;border:2px solid var(--accent)}.token.hidden{opacity:.45}.note{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.small{font-size:12px;opacity:.8}.result{padding:12px;background:var(--card);border-radius:10px}</style></head><body class="dark"><h1>빈칸 읽기와 이어쓰기</h1><p class="small">모식도. 단어 카드는 설명 단위이며 실제 토크나이저나 모델 추론 결과가 아님.</p><div class="controls"><button id="bert" aria-pressed="true">BERT: 앞뒤 읽기</button><button id="gpt" aria-pressed="false">GPT: 앞쪽 읽기</button></div><div id="tokens" class="tokens"></div><p id="description" class="result" aria-live="polite"></p><p class="note">양방향은 빈칸 뒤도 참고. 자동회귀는 다음 자리를 예측할 때 미래 토큰을 볼 수 없음.</p><script>let fromParent=false;function theme(t){document.body.className=t==='light'?'light':'dark'}theme(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='starlight-theme'){fromParent=true;theme(e.data.theme)}});matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{if(!fromParent)theme(e.matches?'light':'dark')});parent.postMessage({type:'figure-ready'},'*');
let mode='bert';function render(){document.getElementById('bert').setAttribute('aria-pressed',mode==='bert');document.getElementById('gpt').setAttribute('aria-pressed',mode==='gpt');const words=mode==='bert'?['Jeju','has','a','[MASK]','near','the','coast.']:['Jeju','has','a','[NEXT]','?','?','?'];const box=document.getElementById('tokens');box.replaceChildren();words.forEach((w,i)=>{const el=document.createElement('span');el.className='token '+(i===3?'target':mode==='bert'||i<3?'visible':'hidden');el.textContent=w;box.appendChild(el)});document.getElementById('description').textContent=mode==='bert'?'판단할 자리: [MASK]. 앞쪽 Jeju has a와 뒤쪽 near the coast.를 함께 참고.':'판단할 자리: [NEXT]. 이미 주어진 Jeju has a만 참고. 뒤의 ?는 아직 주어지지 않은 미래.'}document.getElementById('bert').onclick=()=>{mode='bert';render()};document.getElementById('gpt').onclick=()=>{mode='gpt';render()};render();</script></body></html>
