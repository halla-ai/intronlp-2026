name: Check practice notebook

on:
  pull_request:
    paths:
      - 'notebooks/week-04.ipynb'
      - 'scripts/check_week04.py'
      - 'requirements-check.txt'
      - '.github/workflows/check-notebooks.yml'
  push:
    branches: [main]
    paths:
      - 'notebooks/week-04.ipynb'
      - 'scripts/check_week04.py'
      - 'requirements-check.txt'
      - '.github/workflows/check-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  week04:
    name: Week 4 / fresh Python 3.12 kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-check.txt
      - run: python -m pip install -r requirements-check.txt
      - run: python scripts/check_week04.py
