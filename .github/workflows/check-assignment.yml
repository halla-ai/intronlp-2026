name: Check assignment submission

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'assignments/**'

permissions:
  contents: read

jobs:
  check:
    name: Validate submission layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate submission title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import sys

          pattern = r"\[제출\] (?:0?[1-9]|1[0-5])주차 - [0-9]{6,10}"
          if not re.fullmatch(pattern, os.environ["PR_TITLE"]):
              print("::error::PR 제목은 '[제출] 1주차 - 20260001' 형식으로 적고 이름·연락처를 넣지 마세요.")
              sys.exit(1)
          print("OK. 제출 제목 형식이 올바릅니다.")
          PYTHON

      - name: Validate changed paths
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only "$base" "$head")

          echo "Changed files:"
          echo "$files" | sed 's/^/  /'
          echo

          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              assignments/*)
                # assignments/week-NN/<student-id>/<file>
                if ! echo "$f" | grep -Eq '^assignments/week-[0-9]{2}/[0-9]{6,10}/.+'; then
                  echo "::error file=$f::경로 형식이 맞지 않습니다. assignments/week-01/<학번>/<파일> 형태여야 합니다"
                  fail=1
                fi
                ;;
              *)
                echo "::error file=$f::과제 PR은 assignments/ 아래만 변경해야 합니다. 강의 자료 수정은 별도 PR로 보내주세요"
                fail=1
                ;;
            esac
          done <<< "$files"

          if [ "$fail" -ne 0 ]; then
            echo
            echo "폴더 이름과 PR 제목에는 학번만 쓰고 이름·연락처를 넣지 마세요."
            exit 1
          fi
          echo "OK. 제출 형식이 올바릅니다."
